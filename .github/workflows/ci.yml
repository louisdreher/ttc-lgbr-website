name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci-test-only@localhost:5432/ci_migrations
      TTC_TEST_POSTGRES_URL: postgresql+psycopg://ci:ci-test-only@localhost:5432/postgres
      JWT_SECRET_KEY: ci-test-only-signing-key-not-for-deployment
      LOG_TO_FILE: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Migrate an empty database and check schema
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run backend and PostgreSQL integration tests
        run: python -m pytest -ra

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Match the project npm version
        run: npm install --global npm@10.9.2
      - name: Install locked dependencies
        run: npm ci
      - name: Run Angular tests
        run: npm test -- --watch=false
      - name: Build production frontend
        run: npm run build -- --configuration production

  docker:
    name: Docker build (${{ matrix.component }})
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build image without publishing
        run: docker build --tag ttc-${{ matrix.component }}:ci ./${{ matrix.component }}
